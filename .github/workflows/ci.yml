name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  X_PYTHON_MIN_VERSION: "3.10"
  X_PYTHON_MAX_VERSION: "3.12"

jobs:
  sdk-docs:
    # This job checks, if the automatically generated documentation using sphinx can be compiled
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./sdk
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ env.X_PYTHON_MAX_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.X_PYTHON_MAX_VERSION }}
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install .[docs]
    - name: Check documentation for errors
      run: |
        SPHINXOPTS="-a -E -n -W --keep-going" make -C docs html
    - name: Upload docs as Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: sdk/docs/build/html

  sdk-docs-deploy:
    # Publishes the docs built in sdk-docs to GitHub Pages (main branch only)
    needs: sdk-docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
